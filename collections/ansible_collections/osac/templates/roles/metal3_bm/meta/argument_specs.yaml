---
argument_specs:
  main:
    short_description: Metal3 bare-metal provisioning template role
    options:
      compute_instance_hosts:
        type: list
        required: true
        description: Pre-selected hosts from select_hosts role
      compute_instance_image:
        type: dict
        required: true
        description: Resolved Image with source_ref and boot_method
      compute_instance_ssh_keys:
        type: list
        required: true
        description: List of SSH public key strings
      compute_instance_subnet:
        type: str
        required: false
        description: Subnet reference for network attachment
      compute_instance_security_groups:
        type: list
        required: false
        description: Security group references
      compute_instance_user_data:
        type: str
        required: false
        description: User data string
      compute_instance_class:
        type: dict
        required: false
        description: ComputeInstanceClass capabilities
